aid: etleap
name: Etleap
description: >-
  Etleap is a managed ETL and data-integration platform that streamlines data
  ingestion, transformation, and observability so data teams can build cloud
  data warehouses and lakes with minimal engineering effort. Originally built
  as an "autopilot" for Amazon Redshift, S3, and AWS Glue, Etleap now centers on
  Apache Iceberg as a data foundation: it continuously ingests operational data
  from 50+ databases, SaaS applications, event streams, and files; shapes it
  with visual data wrangling and dbt Core in a single pipeline; and keeps
  destination tables healthy with automated maintenance. Destinations include
  Amazon Redshift, Snowflake, Databricks, Amazon S3, and Iceberg. Etleap exposes
  a REST API v2 for creating and managing connections, pipelines, models, teams,
  and users, and ships an official Terraform provider generated from that API.
